name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $env:GITHUB_PATH
      - name: Install akev from this bucket
        shell: pwsh
        run: |
          scoop bucket add akev "$env:GITHUB_WORKSPACE"
          scoop install akev/akev
          scoop info akev/akev
          akev --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          scoop uninstall akev
          if (Get-Command akev -ErrorAction SilentlyContinue) { throw "akev still on PATH after uninstall" }

  checkver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $env:GITHUB_PATH
      - name: Check the manifest and its autoupdate settings
        shell: pwsh
        run: |
          $scoop = scoop prefix scoop
          & "$scoop\bin\checkver.ps1" -App akev -Dir "$env:GITHUB_WORKSPACE\bucket"
          & "$scoop\bin\checkhashes.ps1" -App akev -Dir "$env:GITHUB_WORKSPACE\bucket"
          & "$scoop\bin\checkurls.ps1" -App akev -Dir "$env:GITHUB_WORKSPACE\bucket"
